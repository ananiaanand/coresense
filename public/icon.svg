<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#382F32" />
      <stop offset="100%" stop-color="#2A2527" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Pendant Chain hint -->
  <path d="M190 60 Q 256 160 322 60" stroke="#B8A9A0" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.6"/>
  <!-- Neumorphic Hexagon Pendant Outer -->
  <polygon points="256,120 380,192 380,336 256,408 132,336 132,192" fill="#302A2C" stroke="#3D3437" stroke-width="4"/>
  <!-- LED Ring -->
  <polygon points="256,150 355,207 355,321 256,378 157,321 157,207" fill="none" stroke="#9CCDB0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
  <!-- Inner Core Disc -->
  <circle cx="256" cy="264" r="54" fill="#FAF8F4" opacity="0.95"/>
  <!-- Pulse heart symbol -->
  <path d="M236 264 L248 250 L256 278 L266 254 L276 264" fill="none" stroke="#F0A9A0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
